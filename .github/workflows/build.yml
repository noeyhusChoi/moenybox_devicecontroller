name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            Moneybox.sln
            Kiosk/Kiosk.csproj
            Kiosk.Tests/Kiosk.Tests.csproj
            DeviceKit/DeviceKit.csproj
            DeviceController/DeviceController.csproj
            IdScannerTool/IdScannerTool.csproj
            tools/M24hSqliteImporter/M24hSqliteImporter.csproj

      - name: Restore solution
        run: dotnet restore .\Moneybox.sln -r win-x64

      - name: Build solution (Debug)
        run: dotnet build .\Moneybox.sln -c Debug --no-restore

      - name: Publish Kiosk (Release, framework-dependent)
        run: >
          dotnet publish .\Kiosk\Kiosk.csproj
          -c Release
          --no-restore
          --no-self-contained
          -r win-x64
          -o .\artifacts\publish\Kiosk

      - name: Verify publish artifacts
        shell: pwsh
        run: |
          $requiredPaths = @(
            'artifacts\publish\Kiosk\Kiosk.exe',
            'artifacts\publish\Kiosk\Assets\Sound\sfx_click.wav',
            'artifacts\publish\Kiosk\Assets\Fonts\NotoSans\Static\NotoSans-Regular.ttf',
            'artifacts\publish\Kiosk\Assets\Icon\ico_voice.svg'
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Required publish artifact not found: $path"
            }
          }

          $requiredReferenceJsonFiles = @(
            'currency.json',
            'deposit_denom.json',
            'deposit_denom_attribute.json'
          )

          $referenceDirectory = 'artifacts\publish\Kiosk\Data\Reference'
          if (-not (Test-Path $referenceDirectory)) {
            throw "Required publish directory not found: $referenceDirectory"
          }

          $publishedReferenceFiles = Get-ChildItem -Path $referenceDirectory -Filter *.json -File | Select-Object -ExpandProperty Name
          foreach ($fileName in $requiredReferenceJsonFiles) {
            if ($fileName -notin $publishedReferenceFiles) {
              throw "Required reference data file not found: $referenceDirectory\$fileName"
            }
          }

          Write-Host 'Publish artifact verification completed.'
