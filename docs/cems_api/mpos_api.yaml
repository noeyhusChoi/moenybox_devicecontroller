components:
  schemas:
    ErrorCode:
      type: string
      description: MoneyBox POS 공통 오류 코드
      enum:
      - '0000'
      - E001
      - E002
      - E003
      - E004
      - E090
      - E091
      x-enum-descriptions:
      - 정상
      - 입력값 누락
      - 숫자형 데이터 아님
      - KEY 값 유효하지 않음
      - DB 처리 중 오류
      - 장비 오류
      - 통신 오류
    CommonAck:
      type: object
      properties:
        result:
          type: boolean
          description: true=정상, false=오류
        ecode:
          $ref: '#/components/schemas/ErrorCode'
  responses:
    ErrorResponse:
      description: 오류 응답
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: boolean
                example: false
              ecode:
                $ref: '#/components/schemas/ErrorCode'
          examples:
            missing_param:
              summary: 필수값 누락
              value:
                result: false
                ecode: E001
            invalid_key:
              summary: KEY 오류
              value:
                result: false
                ecode: E003
