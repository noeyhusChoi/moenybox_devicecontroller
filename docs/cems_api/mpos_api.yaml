openapi: 3.0.3
info:
  title: MoneyBox MPOS API
  version: 1.0.0
  description: |-
    MPOS 포스 API 문서
    - 실제 호출 형식: /api/cmdV2.php?cmd=...
    - Swagger는 cmd별 가독성을 위해 가상 경로(/api/cmdV2.php/C010 등)로 분리
servers:
- url: https://stage-cems.moneybox.or.kr
  description: Staging
- url: https://cems.moneybox.or.kr
  description: Production
tags:
- name: 거래
  description: 환전율/거래 등록/거래 조회/시재조회
- name: 환전 예약
  description: 환전 예약 거래/조회
- name: 온라인 예약
  description: 온라인 예약 거래/조회
paths:
  /api/cmdV2.php/C011:
    get:
      tags:
      - 거래
      summary: 환전율
      description: '실제 호출: /api/cmdV2.php?cmd=C011'
      parameters:
      - name: cmd
        in: query
        required: true
        schema:
          type: string
          example: C011
        example: C011
      - name: key
        in: query
        required: true
        schema:
          type: string
        description: 포스 설정 키
        example: POS-KEY-EXAMPLE
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: 오류여부
                  data:
                    type: array
                    description: 통화별 환율 목록
                    items:
                      type: object
                      properties:
                        "0":
                          type: string
                          description: 통화코드(동일값 currency)
                        currency:
                          type: string
                          description: 통화코드
                        "1":
                          type: string
                          description: 기준환율(동일값 base)
                        base:
                          type: string
                          description: 기준환율
                        "2":
                          type: string
                          description: 매입기준환율(동일값 buy)
                        buy:
                          type: string
                          description: 매입기준환율
                        "3":
                          type: string
                          description: 매각기준환율(동일값 sell)
                        sell:
                          type: string
                          description: 매각기준환율
                        "4":
                          type: string
                          description: 특별매입환율(동일값 spbuy)
                        spbuy:
                          type: string
                          description: 특별매입환율
                        "5":
                          type: string
                          description: 특별매각환율(동일값 spsell)
                        spsell:
                          type: string
                          description: 특별매각환율
              examples:
                success:
                  summary: 정상 응답 예시
                  value:
                    result: true
                    data:
                    - "0": "USD"
                      currency: "USD"
                      "1": "1442.80"
                      base: "1442.80"
                      "2": "1465.5160"
                      buy: "1465.5160"
                      "3": "1442.8000"
                      sell: "1442.8000"
                      "4": "1468.04"
                      spbuy: "1468.04"
                      "5": "1417.56"
                      spsell: "1417.56"
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /api/cmdV2.php/C020:
    get:
      tags:
      - 거래
      summary: 한도 조회
      description: '실제 호출: /api/cmdV2.php?cmd=C020'
      parameters:
      - name: cmd
        in: query
        required: true
        schema:
          type: string
          example: C020
        example: C020
      - name: key
        in: query
        required: true
        schema:
          type: string
        description: 포스 설정 키
        example: POS-KEY-EXAMPLE
      - name: number
        in: query
        required: false
        schema:
          type: string
        description: 실명번호
        example: example
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: 처리결과 (true=정상, false=오류)
                  ecode:
                    type: string
                    description: 오류코드 (result가 false인 경우만)
                  remain:
                    type: string
                    description: 잔여한도(원화기준)
              examples:
                success:
                  summary: 정상 응답 예시
                  value:
                    result: true
                    remain: "3000000"
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /api/cmdV2.php/C030:
    post:
      tags:
      - 거래
      summary: 환전 거래 등록
      description: '실제 호출: /api/cmdV2.php (POST) query에 cmd=C030 포함'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonAck'
              examples:
                success:
                  summary: 성공 예시
                  value:
                    result: true
        '400':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: cmd
        in: query
        required: true
        schema:
          type: string
          enum: 
          - C030
          description: 요청
          example: C030
        example: C030
      - name: key
        in: query
        required: true
        schema:
          type: string
          description: 키오스크에 설정된 키
          example: Y7D8O7V3X8M4A1R6P3F2
        example: C4E7I4W5C4B6L3K4T2C4
      - name: identity
        in: query
        required: false
        schema:
          type: string
          description: 실명구분
          example: 1:여권, 2:주민등록증, 3:운전면허증, 4:기타
        example: '1'
      - name: number
        in: query
        required: false
        schema:
          type: string
          description: 실명번호(여권번호or주민번호)
        example: M12345678
      - name: name
        in: query
        required: false
        schema:
          type: string
          description: 실명
        example: HONG GILDONG
      - name: nation
        in: query
        required: false
        schema:
          type: string
          description: 국적
        example: KOR
      - name: dt
        in: query
        required: false
        schema:
          type: string
          description: 환전일시 (YYYYMMDDHHMISS 또는 YYYYMMDDHHMM)
          pattern: ^\d{12,14}$
          example: '형식 : YYYYMMDDHHMISS'
        example: '20260102103045'
      - name: gubun
        in: query
        required: false
        schema:
          type: string
          description: 매입매출구분
          example: "매입(고객이 외환을 원화로 교환):B, \n매출(고객이 원화를 외환으로 교환):S"
        example: S
      - name: currency_code
        in: query
        required: false
        schema:
          type: string
          description: 통화코드
        example: USD
      - name: unique_key
        in: query
        required: false
        schema:
          type: string
          description: 거래번호
        example: TX-20260102-0001
      - name: KIOSK_PID
        in: query
        required: false
        schema:
          type: string
          description: 키오스크번호
        example: KIOSK-001
      - name: rate
        in: query
        required: false
        schema:
          type: number
          description: 적용환율
        example: 1330.0
      - name: input_money
        in: query
        required: false
        schema:
          type: number
          description: 입금액
          example: 원화, 외화
        example: 200000
      - name: output_money
        in: query
        required: false
        schema:
          type: number
          description: 출금액
          example: 원화, 외화
        example: 150.0
      - name: give_change
        in: query
        required: false
        schema:
