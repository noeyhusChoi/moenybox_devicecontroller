<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>장치 연결 상태 시안</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2b;
      --panel-2: #17243c;
      --text: #e7edf8;
      --muted: #a2b1c9;
      --line: #253553;
      --ok: #16a34a;
      --warn: #ca8a04;
      --err: #dc2626;
      --idle: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
        radial-gradient(80rem 20rem at 10% -10%, #223763 0%, transparent 60%),
        radial-gradient(60rem 18rem at 120% -5%, #1d4b69 0%, transparent 60%),
        var(--bg);
      min-height: 100vh;
      padding: 28px;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .btn {
      border: 1px solid var(--line);
      color: var(--text);
      background: #10182a;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { border-color: #3a527d; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      min-height: 120px;
    }
    .name {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .2px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--idle);
      box-shadow: 0 0 0 4px rgba(107,114,128,.15);
      flex: 0 0 auto;
    }
    .state-ok .dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(22,163,74,.15); }
    .state-connecting .dot { background: var(--warn); box-shadow: 0 0 0 4px rgba(202,138,4,.15); }
    .state-disconnected .dot,
    .state-faulted .dot { background: var(--err); box-shadow: 0 0 0 4px rgba(220,38,38,.15); }

    .pulse { animation: pulse 1.2s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: .9; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: .9; }
    }

    /* A */
    .a-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .a-left { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .msg { margin-top: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* B */
    .chip {
      border-radius: 999px;
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      gap: 8px;
      background: rgba(7, 13, 24, .35);
      font-size: 13px;
      font-weight: 600;
    }
    .chip .badge {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    /* C */
    .c-wrap {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #0e1626;
    }
    .c-head {
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.02);
    }
    .c-msg {
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .bar {
      height: 3px;
      background: var(--idle);
    }
    .state-ok .bar { background: var(--ok); }
    .state-connecting .bar { background: var(--warn); }
    .state-disconnected .bar,
    .state-faulted .bar { background: var(--err); }

    /* D */
    .d-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
    }
    .d-title { font-size: 12px; color: var(--muted); }
    .d-state { font-size: 18px; font-weight: 700; margin-top: 3px; }
    .lamp {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.22);
      background: radial-gradient(circle at 35% 35%, #9ca3af, #4b5563);
      box-shadow: inset 0 1px 5px rgba(255,255,255,.22);
    }
    .state-ok .lamp { background: radial-gradient(circle at 35% 35%, #4ade80, #15803d); }
    .state-connecting .lamp { background: radial-gradient(circle at 35% 35%, #facc15, #a16207); }
    .state-disconnected .lamp,
    .state-faulted .lamp { background: radial-gradient(circle at 35% 35%, #f87171, #991b1b); }

    @media (max-width: 840px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button class="btn" data-set="connected">연결됨</button>
      <button class="btn" data-set="connecting">연결 중</button>
      <button class="btn" data-set="disconnected">연결 끊김</button>
      <button class="btn" data-set="faulted">장치 오류</button>
    </div>

    <div class="grid">
      <section class="card state-connected" data-variant>
        <h3 class="name">시안 A · 최소형 상태바</h3>
        <div class="a-row">
          <div class="a-left"><span class="dot"></span><span data-label>연결됨</span></div>
          <small data-code>IDSCANNER1</small>
        </div>
        <div class="msg" data-msg>장치 연결 정상. 스캔 대기 중입니다.</div>
      </section>

      <section class="card state-connected" data-variant>
        <h3 class="name">시안 B · 칩/배지형</h3>
        <div class="chip">
          <span class="dot pulse"></span>
          <span data-label>연결됨</span>
          <span class="badge" data-msg-short>정상</span>
        </div>
        <div class="msg" data-msg>상태 점검 통과, 이벤트 수신 가능</div>
      </section>

      <section class="card state-connected" data-variant>
        <h3 class="name">시안 C · 얇은 상단 바형</h3>
        <div class="c-wrap">
          <div class="bar"></div>
          <div class="c-head">
            <div class="a-left"><span class="dot"></span><span data-label>연결됨</span></div>
            <small data-code>LIVE</small>
          </div>
          <div class="c-msg" data-msg>Driver heartbeat 정상</div>
        </div>
      </section>

      <section class="card state-connected" data-variant>
        <h3 class="name">시안 D · 대시보드 램프형</h3>
        <div class="d-grid">
          <div>
            <div class="d-title">장치 연결 상태</div>
            <div class="d-state" data-label>연결됨</div>
          </div>
          <div class="lamp"></div>
        </div>
        <div class="msg" data-msg>상태 메시지: 연결 정상</div>
      </section>
    </div>
  </div>

  <script>
    const STATES = {
      connected: {
        label: "연결됨",
        code: "IDSCANNER1",
        msg: "장치 연결 정상. 스캔 대기 중입니다.",
        short: "정상"
      },
      connecting: {
        label: "연결 중",
        code: "TRY",
        msg: "장치 연결을 시도하고 있습니다.",
        short: "시도"
      },
      disconnected: {
        label: "연결 끊김",
        code: "OFFLINE",
        msg: "장치 응답이 없습니다. 케이블/전원을 확인하세요.",
        short: "끊김"
      },
      faulted: {
        label: "장치 오류",
        code: "FAULT",
        msg: "장치 상태 비정상. 확인 후 재시도하세요.",
        short: "오류"
      }
    };

    const variants = document.querySelectorAll("[data-variant]");
    const applyState = (stateKey) => {
      const s = STATES[stateKey] ?? STATES.connected;
      variants.forEach(v => {
        v.classList.remove("state-connected", "state-connecting", "state-disconnected", "state-faulted");
        v.classList.add(`state-${stateKey}`);
        v.querySelectorAll("[data-label]").forEach(el => el.textContent = s.label);
        v.querySelectorAll("[data-msg]").forEach(el => el.textContent = s.msg);
        v.querySelectorAll("[data-msg-short]").forEach(el => el.textContent = s.short);
        v.querySelectorAll("[data-code]").forEach(el => el.textContent = s.code);
      });
    };

    document.querySelectorAll("[data-set]").forEach(btn => {
      btn.addEventListener("click", () => applyState(btn.dataset.set));
    });
  </script>
</body>
</html>
